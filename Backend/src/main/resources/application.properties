spring.application.name=api

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/CamFix?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# Honour @Column(name=...) verbatim - the schema uses mixed-case names
# (Userid, Full_name, DateofBirth) that the default strategy would mangle.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# port server run
server.port=8081
# Stateless JWT API - no HTTP session persistence. Also stops DevTools' default
# (session.persistent=true) from making Tomcat resolve a temp session dir, which
# fails Spring Boot 4.x's ApplicationTemp ownership check when the process runs
# elevated (e.g. "Run VS Code as administrator") against a temp dir a non-elevated
# run created. Simplest real fix: don't run VS Code elevated.
server.servlet.session.persistent=false

# JWT (override app.jwt.secret via an env var in real deployments)
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789-abcdefghij}
app.jwt.expiration-seconds=86400

# Google sign-in: set to the OAuth client ID the Flutter app uses. Left blank
# in dev - the audience check is skipped with a warning when empty.
app.google.client-id=${GOOGLE_CLIENT_ID:}

# Phone OTP. The code is sent via the configured SmsSender (Twilio when the
# app.sms.twilio.* values below are set, otherwise logged to the console).
# expose-code=true also returns the code in the request-otp response for
# testing - set false once real SMS delivery works.
app.otp.ttl-seconds=300
app.otp.max-attempts=5
# Dev: echo the code in the request-otp response (shown as "Dev code" on the
# verify screen) while there's no real SMS/SMTP provider. Set env
# APP_OTP_EXPOSE_CODE=false once Twilio / Gmail SMTP is configured.
app.otp.expose-code=${APP_OTP_EXPOSE_CODE:true}

# Twilio SMS - create a (free trial) account at twilio.com and fill these in
# (or set the env vars). Blank = fall through to TextBelt / log-only.
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.from-number=${TWILIO_FROM_NUMBER:}

# TextBelt SMS - no signup needed. Set to 'textbelt' for the free tier
# (1 real SMS/day per server IP) or a paid key from textbelt.com for volume.
# Used only when the Twilio values above are blank.
app.sms.textbelt.key=${TEXTBELT_KEY:}

# Email OTP via SMTP. For Gmail:
#   MAIL_HOST=smtp.gmail.com  MAIL_PORT=587
#   MAIL_USERNAME=<your-address>@gmail.com
#   MAIL_PASSWORD=<16-char App Password>   (Google account -> Security ->
#       2-Step Verification -> App passwords; the normal password will NOT work)
#   MAIL_FROM="CAM FIX <your-address@gmail.com>"
# Leave MAIL_HOST blank = OTP emails are only logged to the console.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:CAM FIX <no-reply@camfix.local>}