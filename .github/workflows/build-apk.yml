name: Build & Host Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'Camfix_App/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release with permanent download link?'
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (e.g. v1.2.9)'
        type: string
        default: 'v1.2.9'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter & Java
        run: |
          flutter doctor -v
          java -version

      - name: Install Flutter Dependencies
        working-directory: Camfix_App
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: Camfix_App
        run: flutter build apk --release

      - name: Rename APK for Distribution
        run: |
          cp Camfix_App/build/app/outputs/flutter-apk/app-release.apk Camfix_App/build/app/outputs/flutter-apk/Camfix_App.apk

      - name: Upload APK to GitHub Artifacts (Instant Download)
        uses: actions/upload-artifact@v4
        with:
          name: Camfix_App-Release-APK
          path: Camfix_App/build/app/outputs/flutter-apk/Camfix_App.apk
          retention-days: 30

      - name: Create or Update GitHub Release (Permanent Hosted Link)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: Camfix_App/build/app/outputs/flutter-apk/Camfix_App.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag || 'latest' }}
          name: Camfix App ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag || 'latest' }}
          body: |
            ### 📱 Camfix Android Release
            
            Download the latest compiled release APK:
            - **Direct Download:** [Camfix_App.apk](https://github.com/${{ github.repository }}/releases/latest/download/Camfix_App.apk)
            
            **Commit:** `${{ github.sha }}`
            **Built via:** GitHub Actions CI/CD
          draft: false
          prerelease: false
          generate_release_notes: true
